<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>畢業專題網站展</title>
<meta name="description" content="視覺傳達設計系 第 21 屆畢業專題 各組網站入口">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe8; --ink:#1c1a17; --mute:#6e6860; --line:#d9d2c6; --card:#fffdf9; --accent:#d8432f;
  --sans:'Noto Sans TC',system-ui,-apple-system,'PingFang TC',sans-serif;
  --serif:'Noto Serif TC','Songti TC',serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#16140f; --ink:#f1ece3; --mute:#a39b8f; --line:#3a352d; --card:#201d17; --accent:#ff6a52; }
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

header{padding:72px 0 40px;border-bottom:1px solid var(--line)}
.kicker{font:500 12px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font:900 clamp(40px,7vw,84px)/1.05 var(--serif);letter-spacing:-.01em;margin:18px 0 20px}
h1 small{display:block;font:400 clamp(15px,1.6vw,18px)/1.6 var(--sans);color:var(--mute);letter-spacing:.02em;margin-top:14px}
.meta{display:flex;gap:28px;flex-wrap:wrap;font:400 13px/1 var(--mono);color:var(--mute)}
.meta b{color:var(--ink);font-weight:500;margin-right:6px}

main{padding:40px 0 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
a.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -20px rgba(0,0,0,.35)}
.cover{aspect-ratio:16/10;background:var(--line) center/cover no-repeat;position:relative}
.no{position:absolute;left:14px;top:12px;font:500 12px/1 var(--mono);letter-spacing:.12em;background:var(--card);color:var(--ink);padding:6px 9px;border-radius:2px}
.body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h2{font:900 24px/1.25 var(--serif)}
.body .en{font:400 12px/1.2 var(--mono);color:var(--mute);letter-spacing:.06em}
.body p{font-size:14.5px;color:var(--mute);flex:1}
.go{margin-top:8px;font:500 13px/1 var(--mono);letter-spacing:.08em;color:var(--accent)}
.card.soon{opacity:.6}
.card.soon .cover{display:grid;place-items:center;font:500 12px/1 var(--mono);letter-spacing:.2em;color:var(--mute)}
.card.soon .go{color:var(--mute)}

footer{border-top:1px solid var(--line);padding:24px 0 40px;font:400 12px/1.6 var(--mono);color:var(--mute)}
@media (max-width:560px){ .wrap{padding:0 16px} header{padding:48px 0 28px} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="kicker">Graduation Projects · Web</div>
    <h1>畢業專題網站展<small>視覺傳達設計系 第 21 屆 · 各組專題網站入口</small></h1>
    <div class="meta"><span><b id="n-live">0</b>組已上線</span><span><b id="n-all">0</b>組參展</span></div>
  </div>
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>
</main>

<footer><div class="wrap">網站內容與插圖皆為各組學生創作，版權屬各組所有。</div></footer>

<script>
/* 新增一組：在下面加一筆。
   url 填 repo 名稱（例如 'dugu/'）；還沒上線就留空字串 ''，會顯示「準備中」。
   cover 放在 covers/ 資料夾裡。 */
const SITES = [
  { no:'01', name:'GOOD拜 未知國度', en:'GOODBAI', desc:'墓葬文化 × 推測設計，走進四冊國度。', url:'goodbai/', cover:'covers/goodbai.jpg' },
  { no:'02', name:'毛²評估所', en:'MAOMAO', desc:'狗狗評估與一生模擬，認識陪伴的責任。', url:'maomao/', cover:'covers/maomao.jpg' },
  { no:'03', name:'讀菇山行', en:'THE POISONOUS TRAIL', desc:'沿著一棵大樹從溪谷走到 3,000 公尺雪線，認識沿路的毒菇與牠們的環境。', url:'dugu/', cover:'covers/dugu.jpg' },
  { no:'04', name:'灰燼生花', en:'ASH BLOOM', desc:'六個章節，看見灰燼裡長出的新生。', url:'ashbloom/', cover:'covers/ashbloom.jpg' },
];

const grid = document.getElementById('grid');
grid.innerHTML = SITES.map(s => {
  const live = !!s.url;
  const tag = live ? 'a' : 'div';
  const attr = live ? ` href="${s.url}"` : '';
  const cover = s.cover ? ` style="background-image:url('${s.cover}')"` : '';
  return `<${tag} class="card${live ? '' : ' soon'}"${attr}>
    <div class="cover"${cover}><span class="no">NO.${s.no}</span>${live || s.cover ? '' : 'COMING SOON'}</div>
    <div class="body"><span class="en">${s.en}</span><h2>${s.name}</h2><p>${s.desc}</p>
    <span class="go">${live ? '進入網站 →' : '準備中'}</span></div></${tag}>`;
}).join('');
document.getElementById('n-live').textContent = SITES.filter(s => s.url).length;
document.getElementById('n-all').textContent = SITES.length;
</script>
</body>
</html>
